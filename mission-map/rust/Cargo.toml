[package]
name = "mission-map-graph"
version = "0.1.0"
edition = "2021"
description = "DAG + critical path for mission-map; PERT numbers come from C kernels"
license = "MIT"
publish = false

[lib]
name = "mission_map_graph"
path = "src/lib.rs"

[[bin]]
name = "mission-map-graph"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
cc = "1"
