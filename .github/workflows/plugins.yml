name: plugins

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  thin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check workflow scripts
        run: node scripts/ci/check-workflows.mjs
      - name: Check relative links
        run: python3 scripts/check-links.py
      - name: Check catalog drift
        run: python3 scripts/gen-catalogs.py --check
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
      - name: Install Python test tools
        run: python3 -m pip install pytest==9.1.1 coverage==7.16.2
      - name: Run plugin thin tests
        run: |
          set -euo pipefail
          for script in */test/test-thin.sh; do
            if [[ "$script" == intelli-route/* ]]; then
              continue
            fi
            echo "==> $script"
            bash "$script"
          done
      - name: Run intelli-route thin test
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash intelli-route/test/test-thin.sh
      - name: Build mm-kern and run test-kern.sh
        run: |
          set -euo pipefail
          make -C mission-map/c
          ./mission-map/test/test-kern.sh
      - name: Run on-kern test
        run: ./odysseus-navigator/test/test-on-kern.sh
      - name: Run arch-machine tests
        run: |
          set -euo pipefail
          command -v jq >/dev/null 2>&1 || sudo apt-get install -y jq
          export ARCH_MACHINE_ROOT="$GITHUB_WORKSPACE/arch-machine/fixtures/mock-arch"
          test -f "$ARCH_MACHINE_ROOT/install.sh"
          ./arch-machine/test/test-core-map.sh
          ./arch-machine/test/test-expand-consent.sh
          ./arch-machine/test/test-expand-real.sh
          ./arch-machine/test/test-audit-status.sh
      - name: Run eva tether test
        run: ./eva-emptiness/test/test-eva-tether.sh
      - name: Check premflow stub and missing CLI
        run: bash scripts/ci/test-premflow-stub.sh
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: stable
      - name: Run mission-map lifeos graph test
        run: |
          set -euo pipefail
          cargo build --manifest-path mission-map/rust/Cargo.toml
          ./mission-map/test/test-lifeos-graph.sh
      - name: Run craft score checks
        run: ./craft/test/check-scores.sh
      - name: Run craft acceptance check
        run: ./craft/test/check-acceptance-first.sh --self
      - name: Run craft proof check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v2.0.35 --repo bendlang/bend --pattern bend-2.0.35-linux-x64.tar.gz --clobber --dir "$RUNNER_TEMP"
          gh release download v4.34.0 --repo leanprover/lean4 --pattern lean-4.34.0-linux.tar.zst --clobber --dir "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"
          printf '%s\n' \
            '63039d1a119f716767ac5a7d8fe0717cfacf219c6c253c35192148e0dade722f  bend-2.0.35-linux-x64.tar.gz' \
            'caaa98356098c85dc0fcbbd28e1ec66f39eb6551829972b752ff20e1286b646b  lean-4.34.0-linux.tar.zst' \
            | sha256sum -c
          tar --warning=no-unknown-keyword -xzf bend-2.0.35-linux-x64.tar.gz -C "$RUNNER_TEMP"
          command -v zstd >/dev/null 2>&1 || sudo apt-get install -y zstd
          tar --zstd -xf lean-4.34.0-linux.tar.zst -C "$RUNNER_TEMP"
          export PATH="$RUNNER_TEMP/bend/bin:$RUNNER_TEMP/lean-4.34.0-linux/bin:$PATH"
          cd "$GITHUB_WORKSPACE"
          bend version
          lean --version
          proof_ec=0
          proof_out="$(cd trust-stack/bend && bend PROOF.bend)" || proof_ec=$?
          printf '%s\n' "$proof_out"
          [[ "$proof_ec" -eq 0 ]]
          if printf '%s\n' "$proof_out" | grep -q 'SOME PROOFS FAIL'; then
            exit 1
          fi
          if printf '%s\n' "$proof_out" | grep -qE '(^|[[:space:]])FAIL([[:space:]]|$)'; then
            exit 1
          fi
          printf '%s\n' "$proof_out" | grep -q 'ALL PROOFS CHECK'
          ./craft/test/check-proof.sh --self

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: stable
      - name: Build mission-map-graph
        run: cargo build --manifest-path mission-map/rust/Cargo.toml
      - name: Run tstack end-to-end flows
        run: bash tstack/test/test-e2e.sh
