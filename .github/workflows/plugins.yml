name: plugins

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  thin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
      - name: Install Python test tools
        run: python3 -m pip install pytest==9.1.1 coverage==7.16.2
      - name: Run plugin thin tests
        run: |
          set -euo pipefail
          for script in */test/test-thin.sh; do
            if [[ "$script" == intelli-route/* ]]; then
              continue
            fi
            echo "==> $script"
            bash "$script"
          done
      - name: Run intelli-route thin test
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash intelli-route/test/test-thin.sh
      - name: Run craft score checks
        run: ./craft/test/check-scores.sh
      - name: Run craft acceptance check
        run: ./craft/test/check-acceptance-first.sh --self
      - name: Run craft proof check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v2.0.35 --repo bendlang/bend --pattern bend-2.0.35-linux-x64.tar.gz --clobber --dir "$RUNNER_TEMP"
          tar --warning=no-unknown-keyword -xzf "$RUNNER_TEMP/bend-2.0.35-linux-x64.tar.gz" -C "$RUNNER_TEMP"
          gh release download v4.34.0 --repo leanprover/lean4 --pattern lean-4.34.0-linux.tar.zst --clobber --dir "$RUNNER_TEMP"
          command -v zstd >/dev/null 2>&1 || sudo apt-get install -y zstd
          tar --zstd -xf "$RUNNER_TEMP/lean-4.34.0-linux.tar.zst" -C "$RUNNER_TEMP"
          export PATH="$RUNNER_TEMP/bend/bin:$RUNNER_TEMP/lean-4.34.0-linux/bin:$PATH"
          bend version
          lean --version
          ./craft/test/check-proof.sh --self
